<style>
  :root {
    --page: #e9e9e9;
    --win-bg: #acacac;          /* Window Background #FFACACAC */
    --panel-bg: #d5d5d2;        /* Button-Leiste #FFD5D5D2 */
    --title-bg: #ffffff;
    --title-fg: #000000;
    --text: #000000;
    --frame: #8c8c8c;
    --btn-top: #f0f0f0;
    --btn-bottom: #e5e5e5;
    --btn-border: #707070;
    --btn-hover-bg: #e5f1fb;
    --btn-hover-border: #3c7fb1;
    --btn-press-bg: #cce4f7;
    --btn-press-border: #2c628b;
    --btn-dis-bg: #f4f4f4;
    --btn-dis-border: #adb2b5;
    --btn-dis-fg: #838383;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #1e1e1e; }
  }
  :root[data-theme="dark"] { --page: #1e1e1e; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
  }

  /* Fenster (300 x 320 wie im WPF-Original) */
  .window {
    width: 300px;
    max-width: 100%;
    border: 1px solid var(--frame);
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
    background: var(--win-bg);
  }
  .titlebar {
    height: 31px;
    background: var(--title-bg);
    color: var(--title-fg);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    font-size: 12px;
  }
  .titlebar img { width: 16px; height: 16px; }

  /* Grid: RowDefinitions 37 / 50 / 37 / 50 / 45 / 45 */
  .grid {
    display: grid;
    grid-template-rows: 37px 50px 37px 50px 45px 45px;
    padding-bottom: 6px;
  }
  .label, .timer {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: pre;
  }
  .label { font-size: 20px; }
  .timer { font-size: 30px; font-variant-numeric: tabular-nums; }

  .buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    background: var(--panel-bg);
  }
  .export-row {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* klassischer WPF-Button */
  button {
    width: 50px;
    height: 25px;
    padding: 0;
    font: 12px "Segoe UI", system-ui, sans-serif;
    color: #000;
    background: linear-gradient(var(--btn-top), var(--btn-bottom));
    border: 1px solid var(--btn-border);
    border-radius: 0;
    cursor: default;
  }
  button:hover:not(:disabled) { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); }
  button:active:not(:disabled) { background: var(--btn-press-bg); border-color: var(--btn-press-border); }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  button:disabled {
    background: var(--btn-dis-bg);
    border-color: var(--btn-dis-border);
    color: var(--btn-dis-fg);
  }

  .hint {
    position: fixed;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

<div class="window" role="application" aria-label="Stopwatch">
  <div class="titlebar">
    <img alt="" id="titleIcon">
    <span>Stopwatch</span>
  </div>

  <div class="grid">
    <div class="label">Minutes : 1/100</div>
    <div class="timer" id="timerText">0:00</div>
    <div class="label">Split &amp; Minutes : 1/100</div>
    <div class="timer" id="timerText2"></div>
    <div class="buttons">
      <button id="startButton">Start</button>
      <button id="stopButton" disabled>Stop</button>
      <button id="resetButton" disabled>Reset</button>
    </div>
    <div class="export-row">
      <button id="exportButton" disabled>Export</button>
    </div>
  </div>
</div>

<div class="hint">Tasten: Leertaste = Start/Split · S = Stop · R = Reset</div>

<script>
(() => {
  // ---- System.Diagnostics.Stopwatch nachgebildet ----
  const stopwatch = {
    elapsedMs: 0,
    startedAt: null,
    get isRunning() { return this.startedAt !== null; },
    start() { if (!this.isRunning) this.startedAt = performance.now(); },
    stop()  { if (this.isRunning) { this.elapsedMs += performance.now() - this.startedAt; this.startedAt = null; } },
    reset() { this.elapsedMs = 0; this.startedAt = null; },
    get elapsed() { return this.elapsedMs + (this.isRunning ? performance.now() - this.startedAt : 0); }
  };

  let round = 0;
  const output = new Map();   // IDictionary<int, string>
  let seconds = 0;            // eigentlich 1/100 Minuten (Industrieminuten)

  const $ = id => document.getElementById(id);
  const timerText = $('timerText'), timerText2 = $('timerText2');
  const startButton = $('startButton'), stopButton = $('stopButton'),
        resetButton = $('resetButton'), exportButton = $('exportButton');

  $('titleIcon').src = document.querySelector('link[rel=icon]').href;

  // .NET Math.Round(x, 0) rundet "banker's rounding" (Mitte -> gerade Zahl)
  function roundHalfEven(x) {
    const f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }

  // entspricht seconds.ToString("0:00.")  ->  z.B. 523 => "5:23", 7 => "0:07"
  function fmt(n) {
    return Math.floor(n / 100) + ':' + String(n % 100).padStart(2, '0');
  }

  function startButton_Click() {
    stopwatch.start();
    startButton.textContent = 'Split';
    stopButton.disabled = false;
    resetButton.disabled = true;
    exportButton.disabled = true;
    if (round > 0) output.set(round, String(seconds));
    round++;
  }

  function stopButton_Click() {
    stopwatch.stop();
    startButton.disabled = false;
    stopButton.disabled = true;
    resetButton.disabled = false;
    exportButton.disabled = false;
    startButton.textContent = 'Start';
  }

  function resetButton_Click() {
    stopwatch.reset();
    timerText.textContent = '0:00';
    startButton.disabled = false;
    stopButton.disabled = true;
    resetButton.disabled = true;
    exportButton.disabled = true;
    round = 0;
    output.clear();
    timerText2.textContent = '';
  }

  function timer_Tick() {
    if (!stopwatch.isRunning) return;
    const totalMinutes = stopwatch.elapsed / 60000;
    seconds = roundHalfEven(totalMinutes * 100);
    timerText.textContent = fmt(seconds);

    if (round > 1) {
      const s = output.get(round - 1);
      if (s.length >= 3) {
        timerText2.textContent = (round - 1) + '   ' + s.substring(0, s.length - 2) + ':' + s.substring(s.length - 2);
      } else {
        timerText2.textContent = (round - 1) + '   0:' + s.padStart(2, '0');
      }
    }
  }

  // CSV: Trennzeichen ";" bei deutscher Oberfläche, sonst ","
  function buildCSV(dict) {
    const sep = (navigator.language || '').slice(0, 2).toLowerCase() === 'de' ? ';' : ',';
    return Array.from(dict, ([k, v]) => `${k}${sep}${v}`).join('\r\n');
  }

  async function exportButton_Click() {
    const csv = buildCSV(output);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'Stopwatch.csv',
          types: [{ description: 'CSV-Dateien (*.csv)', accept: { 'text/csv': ['.csv'] } }]
        });
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // Dialog abgebrochen
        throw e;
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Stopwatch.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    exportButton.disabled = true;
  }

  startButton.addEventListener('click', startButton_Click);
  stopButton.addEventListener('click', stopButton_Click);
  resetButton.addEventListener('click', resetButton_Click);
  exportButton.addEventListener('click', exportButton_Click);

  // Window_KeyDown: Space -> Start/Split, S -> Stop, R -> Reset
  // (wie im Original per RaiseEvent, also unabhängig vom Enabled-Zustand)
  window.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space')      { e.preventDefault(); startButton_Click(); }
    else if (e.code === 'KeyS')  { e.preventDefault(); stopButton_Click(); }
    else if (e.code === 'KeyR')  { e.preventDefault(); resetButton_Click(); }
  });
  // Leertaste soll keinen fokussierten Button zusätzlich auslösen
  window.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });

  // DispatcherTimer mit 100 ms Intervall
  setInterval(timer_Tick, 100);
})();
</script>
</body>
</html>
